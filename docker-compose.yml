version: '3.8'

services:
  backend:
    build: ./backend
    container_name: aegis_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aegis_frontend
    ports:
      - "8080:80"  # Truy cập frontend tại http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
